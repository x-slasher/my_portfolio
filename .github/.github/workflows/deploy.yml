name: Deploy Portfolio

on:
  push:
    branches:
      - main          # triggers on every push to main
  pull_request:
    branches:
      - main          # runs build check on PRs (no deploy)

# Allow this workflow to write to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────
  # JOB 1 — Lint & Build
  # ─────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint --if-present

      - name: 🏗️ Build
        run: npm run build
        env:
          # Set this to /your-repo-name/ for GitHub Pages subdirectory deployment
          # e.g. VITE_BASE_PATH: /portfolio/
          # Leave as / for custom domain (nayeemhasan.dev) or Vercel/Netlify
          VITE_BASE_PATH: /

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ─────────────────────────────────────
  # JOB 2 — Deploy (only on main push)
  # ─────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
