name: Deploy to Vercel

# ─────────────────────────────────────────────────────────────────
# ALTERNATIVE: Use this workflow instead of deploy.yml if you prefer
# deploying to Vercel instead of GitHub Pages.
#
# Setup steps:
#   1. Create a project on vercel.com linked to your GitHub repo
#   2. Go to Settings → Tokens → Create a token  →  copy it
#   3. In your GitHub repo → Settings → Secrets → Actions:
#      Add:  VERCEL_TOKEN       (the token you just created)
#            VERCEL_ORG_ID      (from vercel.com/account → Settings)
#            VERCEL_PROJECT_ID  (from project → Settings → General)
# ─────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint --if-present

      - name: 🏗️ Build
        run: npm run build

      - name: 🚀 Deploy to Vercel (Preview — PRs)
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./

      - name: 🚀 Deploy to Vercel (Production — main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
